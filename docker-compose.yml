# AI 客服系统基础设施编排（Milvus + MinIO 共享）
# 使用方法：
#   启动：cd <项目根目录> ; docker compose --env-file ./ai-customer-backend/.env.production -f docker-compose.yml up -d
#   停止：docker compose -f docker-compose.yml down
#   查看状态：docker compose -f docker-compose.yml ps
#
# 组件清单：
#   - etcd: Milvus 元数据存储
#   - minio: 对象存储（Milvus 索引 + 知识库上传文件共用，用不同 bucket 区分）
#   - milvus: 向量数据库 standalone 模式

services:
  # ---------- Etcd（Milvus 元数据） ----------
  etcd:
    container_name: ai-customer-etcd
    image: quay.io/coreos/etcd:v3.5.13
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./.data/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    ports:
      - "2379:2379"
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: always
    networks:
      - ai-customer-net

  # ---------- MinIO（Milvus + 知识库文件共用） ----------
  minio:
    container_name: ai-customer-minio
    image: minio/minio:RELEASE.2024-08-03T04-33-23Z
    environment:
      # 从 --env-file 注入，禁止把真实凭据写入 Compose 文件。
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}"
    volumes:
      - ./.data/minio:/data
    command: minio server /data --console-address ":9001"
    ports:
      - "9000:9000"    # S3 API 端口（settings.MINIO_PORT=9000）
      - "9001:9001"    # 管理控制台，浏览器打开 http://localhost:9001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: always
    networks:
      - ai-customer-net

  # ---------- Milvus standalone ----------
  milvus:
    container_name: ai-customer-milvus
    image: milvusdb/milvus:v2.4.13
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      # 复用上面的 minio 服务，而不是再起一个
      MINIO_ADDRESS: minio:9000
      # Milvus 2.4 环境变量名为 MINIO_ACCESS_KEY_ID / MINIO_SECRET_ACCESS_KEY
      # （旧名 MINIO_ACCESS_KEY / MINIO_SECRET_KEY 已不被识别，会导致用默认 minioadmin 凭据报错）
      MINIO_ACCESS_KEY_ID: "${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}"
      MINIO_SECRET_ACCESS_KEY: "${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}"
      MINIO_BUCKET_NAME: a-bucket
      # 开启本地盘落盘
      ETCD_USE_EMBED: "false"
      COMMON_STORAGETYPE: minio
    volumes:
      - ./.data/milvus:/var/lib/milvus
    ports:
      - "19530:19530"  # gRPC（settings.MILVUS_PORT=19530）
      - "9091:9091"    # HTTP / metrics
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 120s
    depends_on:
      - etcd
      - minio
    restart: always
    networks:
      - ai-customer-net

networks:
  ai-customer-net:
    driver: bridge
