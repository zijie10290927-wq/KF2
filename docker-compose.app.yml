# AI 客服系统应用层编排（Backend + Nginx）
# 与 docker-compose.yml（基础设施：etcd/minio/milvus）配套使用：
#   docker compose --env-file ./ai-customer-backend/.env.production -f docker-compose.yml -f docker-compose.app.yml up -d
#
# 启动前必须先：
#   1. 构建后端镜像：cd ai-customer-backend && docker build -t ai-customer-backend:prod .
#   2. 前端构建：cd ai-customer-frontend && npm run build  （生成 dist/）
#   3. 准备 .env.production（生产环境变量，包含安全随机密钥）
#      - 不通过镜像内置，而是 env_file 注入，避免密钥进入镜像层

services:
  # ---------- Backend (FastAPI + Gunicorn + Uvicorn) ----------
  backend:
    image: ai-customer-backend:prod
    container_name: ai-customer-backend
    env_file:
      # 生产环境密钥从 .env.production 注入，避免镜像硬编码
      - ./ai-customer-backend/.env.production
    environment:
      # 容器内访问 docker compose 网络内的 Milvus/MinIO，需用服务名
      - MILVUS_HOST=milvus
      - MINIO_HOST=minio
      - REDIS_HOST=redis
      # 容器内监听 0.0.0.0
      - APP_ENV=production
    ports:
      - "8000:8000"   # 调试/直连；生产可改为仅暴露给 nginx
    volumes:
      # SQLite / Milvus Lite / 本地降级文件持久化，容器重建后数据不丢失。
      - ./.data/backend:/app/data
    depends_on:
      milvus:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always
    networks:
      - ai-customer-net

  # ---------- Nginx (前端静态 + 反向代理) ----------
  nginx:
    image: nginx:alpine
    container_name: ai-customer-nginx
    volumes:
      # 前端构建产物
      - ./ai-customer-frontend/dist:/usr/share/nginx/html:ro
      # Nginx 配置
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"      # 对外入口
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    networks:
      - ai-customer-net

  # ---------- Redis (限流 + Webhook 去重 + Session) ----------
  # 与 MySQL/Milvus/MinIO 不同，Redis 通常和应用同节点部署
  redis:
    image: redis:alpine
    container_name: ai-customer-redis
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - ./.data/redis:/data
    ports:
      - "6379:6379"
    restart: always
    networks:
      - ai-customer-net

networks:
  ai-customer-net:
    driver: bridge
