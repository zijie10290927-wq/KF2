# Alembic 配置文件

[alembic]
# 迁移脚本目录
script_location = alembic

# 模板
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# 时区
timezone = Asia/Shanghai

# Python 路径前缀
prepend_sys_path = .

# 版本表名
version_table = alembic_version

# 输出编码
output_encoding = utf-8

# 数据库 URL（实际从 .env 读取，这里仅占位，env.py 会覆盖）
sqlalchemy.url = mysql+aiomysql://root:password@localhost:3306/ai_customer?charset=utf8mb4


[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s | %(levelname)-4s | %(name)s | %(message)s
datefmt = %H:%M:%S
