repos:
  # ===== 后端 Ruff（lint + format）=====
  # language: system 直接调用后端 venv 中的 ruff，免 pre-commit 自建 virtualenv
  # （既绕开本机 virtualenv .lock 写入限制，也加快首次提交）。
  # 仓库相对路径定位二进制，提交前无需手动激活 venv。
  - repo: local
    hooks:
      - id: ruff
        name: ruff (backend)
        language: system
        entry: ai-customer-backend/.venv/Scripts/ruff.exe
        args: [check, --fix, --exit-non-zero-on-fix]
        files: ^ai-customer-backend/.*\.py$
      - id: ruff-format
        name: ruff-format (backend)
        language: system
        entry: ai-customer-backend/.venv/Scripts/ruff.exe
        args: [format, --check]
        files: ^ai-customer-backend/.*\.py$

  # ===== 前端 ESLint + Prettier（调用前端 node_modules 本地安装）=====
  - repo: local
    hooks:
      - id: eslint
        name: eslint (frontend)
        language: system
        entry: ai-customer-frontend/node_modules/.bin/eslint
        args: [--fix]
        files: ^ai-customer-frontend/src/.*\.(ts|vue)$
      - id: prettier
        name: prettier (frontend)
        language: system
        entry: ai-customer-frontend/node_modules/.bin/prettier
        args: [--write]
        files: ^ai-customer-frontend/src/.*\.(ts|vue|scss|css)$

  # ===== 通用安全与卫生检查 =====
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files   # 禁止提交 >500KB 大文件
        args: [--maxkb=500]
      - id: detect-private-key        # 检测私钥文件
      - id: check-merge-conflict      # 检查未解决的合并冲突
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: \.(md|html)$
