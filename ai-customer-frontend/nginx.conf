# AI Customer Frontend - nginx 配置
# 职责:
#   1. 静态文件服务(Vue3 dist)
#   2. 反代 /api/* 到 backend service(集群内 service name: backend)
#   3. SSE 兼容:对 /api/v1/chat/stream 关闭 proxy_buffering,允许流式响应

server {
    listen       80;
    server_name  _;

    # 前端静态资源
    root   /usr/share/nginx/html;
    index  index.html;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Vue Router history 模式:任何未匹配路由都回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代到 backend service(K8s service name=backend,端口 8000)
    # 关键:对 /api/v1/chat/stream(SSE)关闭缓冲,允许实时推送
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE:必须关闭缓冲并设置长超时,否则流式响应会被 nginx 缓存
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;

        # WebSocket 升级(虽然项目目前用 SSE,保留兼容)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 健康检查
    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}